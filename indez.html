<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Centering Example</title>
    <style>

.flex-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    width: 300px;
    height: 200px;
    background-color: #ff0000;
}
</style>
</head>
<body>
    <div class="flex-container">
        <div class="box"></div>
    </div>
</body>
</html>
